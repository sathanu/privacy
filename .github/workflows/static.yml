name: FTP Deploy using lftp (preserve .well-known and cgi-bin)

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Clean remote folder (except .well-known and cgi-bin) and upload
        run: |
          lftp -u vaikpvwe,7273OObjk*EHo# -e "
            open ftp.optimus.herosite.pro;
            cd /production.shiningdawn.in;

            # Remove all files/folders except .well-known and cgi-bin
            cls -1 --sort=date | grep -vE '^\.well-known$|^cgi-bin$' | while read item; do
              echo \"Deleting: \$item\";
              rm -r \$item;
            done;

            # Mirror local files to remote
            mirror -R -e ./ /production.shiningdawn.in/;

            bye
          "
